<!-- Privacy Consent Modal -->
<div id="privacy-modal" class="privacy-modal" role="dialog" aria-modal="true" aria-labelledby="privacy-modal-title"
  hidden>
  <div class="privacy-modal__overlay"></div>
  <div class="privacy-modal__content">
    <div class="privacy-modal__header">
      <div class="privacy-modal__title-wrapper">
        <h2 id="privacy-modal-title">Umami Analytics</h2>
        <p class="privacy-modal__subline">Open source privacy-first analytics platform</p>
      </div>
      <button class="privacy-modal__close btn--icon" type="button" aria-label="Close privacy settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M10.5859 12L2.79297 4.20706L4.20718 2.79285L12.0001 10.5857L19.793 2.79285L21.2072 4.92893L13.4143 12L21.2072 19.7928L19.793 21.2071L12.0001 13.4142L4.20718 21.2071L2.79297 19.7928L10.5859 12Z" />
        </svg>
      </button>
    </div>

    <div class="privacy-modal__section">
      <label class="privacy-switch">
        <span class="privacy-switch__text">
          <span class="privacy-switch__label">Engagement tracking</span>
          <span class="privacy-switch__subline">This helps me decide what kind of work to showcase.</span>
        </span>
        <span class="privacy-switch__control">
          <input class="privacy-switch__input" type="checkbox" id="toggle-engagement-tracking" checked>
          <span class="privacy-switch__track"></span>
        </span>
      </label>
    </div>

    <div class="privacy-modal__section">
      <label class="privacy-switch">
        <span class="privacy-switch__text">
          <span class="privacy-switch__label">Invasive tracking</span>
          <span class="privacy-switch__subline">Never collected, your privacy is important.</span>
        </span>
        <span class="privacy-switch__control">
          <input class="privacy-switch__input" type="checkbox" id="toggle-invasive-tracking" aria-disabled="true" tabindex="-1">
          <span class="privacy-switch__track"></span>
        </span>
      </label>
    </div>

  </div>
</div>
