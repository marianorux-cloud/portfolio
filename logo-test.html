<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo test — local prototype</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/fonts/OverusedGrotesk-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/OverusedGrotesk-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/OverusedGrotesk-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body.logo-test {
      --logo-test-slot-width: 44px;
      --logo-test-large-scale: 1;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
    }

    body.logo-test #logo-test {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.logo-test .logo-test-navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      width: 100%;
      background: var(--color-bg);
      background: color-mix(in srgb, var(--color-bg) 88%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--color-text) 12%, transparent);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    body.logo-test .logo-test-navbar .navbar__inner {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    body.logo-test .logo-test-navbar .navbar__left {
      display: flex;
      align-items: center;
      gap: var(--space-2xs);
      flex: 0 0 auto;
    }

    body.logo-test .logo-test-navbar .navbar__right {
      display: flex;
      align-items: center;
      gap: var(--space-2xs);
      margin-left: auto;
      flex: 0 0 auto;
    }

    body.logo-test .logo-test-back[hidden] {
      display: none;
    }

    body.logo-test .logo-test-logo {
      position: relative;
      display: block;
      flex: 0 0 var(--logo-test-slot-width);
      width: var(--logo-test-slot-width);
      height: 33px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background-color: transparent;
      -webkit-mask-image: none;
      mask-image: none;
      cursor: pointer;
    }

    body.logo-test .logo-test-logo:hover {
      background-color: transparent;
    }

    body.logo-test .logo-test-logo__small,
    body.logo-test .logo-test-logo__large-clip,
    body.logo-test .logo-test-logo__large {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      pointer-events: none;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    body.logo-test .logo-test-logo__small,
    body.logo-test .logo-test-logo__large {
      background-color: var(--color-icon);
    }

    body.logo-test .logo-test-logo__small {
      width: 44px;
      height: 33px;
      opacity: 1;
      -webkit-mask-image: url("assets/staging/logo-sm.svg");
      mask-image: url("assets/staging/logo-sm.svg");
      will-change: opacity;
    }

    body.logo-test .logo-test-logo__large-clip {
      width: 152px;
      height: 33px;
      opacity: 0;
      overflow: hidden;
      clip-path: inset(0 94px 0 0);
      -webkit-clip-path: inset(0 94px 0 0);
      will-change: clip-path, opacity;
    }

    body.logo-test .logo-test-logo__large {
      width: 152px;
      height: 33px;
      transform: scale(var(--logo-test-large-scale));
      transform-origin: left center;
      -webkit-mask-image: url("assets/staging/logo-xl.svg");
      mask-image: url("assets/staging/logo-xl.svg");
    }

    body.logo-test .logo-test-logo[data-logo-state="expanded"] .logo-test-logo__small {
      opacity: 0;
    }

    body.logo-test .logo-test-logo[data-logo-state="expanded"] .logo-test-logo__large-clip {
      opacity: 1;
      clip-path: inset(0 0 0 0);
      -webkit-clip-path: inset(0 0 0 0);
    }

    body.logo-test .logo-test-logo__sprite {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      height: 33px;
      width: auto;
      overflow: visible;
      pointer-events: none;
    }

    body.logo-test[data-treatment="single-source"] .logo-test-logo__small,
    body.logo-test[data-treatment="single-source"] .logo-test-logo__large-clip {
      display: none;
    }

    body.logo-test[data-treatment="single-source"] .logo-test-logo__sprite {
      display: block;
    }

    body.logo-test .logo-test-logo__sprite [data-logo-piece],
    body.logo-test .logo-test-logo__sprite [data-letter-index] {
      transform-box: view-box;
    }

    body.logo-test .logo-test-logo__sprite [data-logo-piece="top-rail"],
    body.logo-test .logo-test-logo__sprite [data-logo-piece="bottom-rail"] {
      transform-origin: 21.5058px 0px;
      will-change: transform;
    }

    body.logo-test .logo-test-logo__sprite [data-logo-piece="right-cap"] {
      transform-origin: 0px 0px;
      will-change: transform;
    }

    body.logo-test .logo-test-logo__sprite [data-letter-index="0"],
    body.logo-test .logo-test-logo__sprite [data-letter-index="7"] {
      transform-origin: 0px 0px;
      will-change: transform;
    }

    body.logo-test .logo-test-logo__sprite [data-letter-index] {
      will-change: opacity;
    }

    body.logo-test .logo-test-footer__logo--large {
      display: flex;
      align-items: center;
      width: 152px;
      height: 33px;
      flex: 0 0 152px;
    }

    body.logo-test .logo-test-footer__large-mark {
      display: block;
      width: 152px;
      height: 33px;
      background-color: var(--color-icon);
      -webkit-mask-image: url("assets/staging/logo-xl.svg");
      mask-image: url("assets/staging/logo-xl.svg");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    body.logo-test .logo-test-tunable {
      display: flex;
      flex-direction: column;
      gap: var(--space-2xs);
    }

    body.logo-test .logo-test-tunable-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-tunable-row output {
      color: var(--color-text);
      font-weight: var(--font-weight-bold);
    }

    body.logo-test .logo-test-tunable input[type="range"] {
      width: 100%;
      accent-color: var(--color-text);
      cursor: pointer;
    }

    body.logo-test .logo-test-main {
      flex: 1 0 auto;
      width: 100%;
    }

    body.logo-test .logo-test-section {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-lg);
    }

    body.logo-test .logo-test-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
      gap: var(--space-2xl);
      align-items: end;
      padding-top: var(--space-3xl);
      padding-bottom: var(--space-2xl);
    }

    body.logo-test .logo-test-eyebrow,
    body.logo-test .logo-test-kicker {
      color: var(--color-icon);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-bold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    body.logo-test .logo-test-hero h1 {
      max-width: 13ch;
      margin-top: var(--space-sm);
      font-size: clamp(2.75rem, 7vw, 6.75rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    body.logo-test .logo-test-hero-copy {
      max-width: 46ch;
      margin-top: var(--space-lg);
      color: color-mix(in srgb, var(--color-text) 72%, transparent);
      font-size: var(--text-md);
    }

    body.logo-test .logo-test-hero-copy strong {
      color: var(--color-text);
      font-weight: var(--font-weight-bold);
    }

    body.logo-test .logo-test-hero-panel {
      padding: var(--space-lg);
      border: 1px solid color-mix(in srgb, var(--color-text) 18%, transparent);
      border-radius: 18px;
      background: color-mix(in srgb, var(--color-text) 4%, transparent);
    }

    body.logo-test .logo-test-panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
      font-weight: var(--font-weight-bold);
    }

    body.logo-test .logo-test-panel-heading output {
      font-size: var(--text-lg);
      letter-spacing: -0.04em;
    }

    body.logo-test .logo-test-panel-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-md);
      padding-top: var(--space-sm);
      color: color-mix(in srgb, var(--color-text) 70%, transparent);
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-panel-row output {
      color: var(--color-text);
      font-weight: var(--font-weight-bold);
      text-align: right;
    }

    body.logo-test .logo-test-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.72fr);
      gap: var(--space-2xl);
      align-items: start;
      border-top: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
    }

    body.logo-test .logo-test-section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }

    body.logo-test .logo-test-section-heading h2 {
      font-size: var(--text-xl);
      letter-spacing: -0.035em;
    }

    body.logo-test .logo-test-section-heading p {
      max-width: 42ch;
      color: color-mix(in srgb, var(--color-text) 65%, transparent);
      font-size: var(--text-sm);
      text-align: right;
    }

    body.logo-test .logo-test-control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-md);
    }

    body.logo-test .logo-test-fieldset {
      min-width: 0;
      padding: 0;
      border: 0;
    }

    body.logo-test .logo-test-fieldset legend,
    body.logo-test .logo-test-control-label {
      display: block;
      margin-bottom: var(--space-sm);
      color: var(--color-text);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-bold);
    }

    body.logo-test .logo-test-choice-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2xs);
    }

    body.logo-test .logo-test-choice,
    body.logo-test .logo-test-select,
    body.logo-test .logo-test-motion-toggle {
      min-height: 42px;
      border: 1px solid color-mix(in srgb, var(--color-text) 22%, transparent);
      border-radius: 999px;
      background: var(--color-bg);
      color: var(--color-text);
      font: inherit;
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-choice,
    body.logo-test .logo-test-select {
      padding: 0.55rem 0.9rem;
    }

    body.logo-test .logo-test-choice {
      cursor: pointer;
    }

    body.logo-test .logo-test-choice:hover,
    body.logo-test .logo-test-select:hover,
    body.logo-test .logo-test-motion-toggle:hover {
      border-color: var(--color-text);
    }

    body.logo-test .logo-test-choice[aria-pressed="true"] {
      border-color: var(--color-text);
      background: var(--color-text);
      color: var(--color-bg);
    }

    body.logo-test .logo-test-select {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }

    body.logo-test .logo-test-policy-copy {
      margin-top: var(--space-sm);
      color: color-mix(in srgb, var(--color-text) 65%, transparent);
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-motion-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }

    body.logo-test .logo-test-motion-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--color-text);
    }

    body.logo-test .logo-test-note {
      margin-top: var(--space-md);
      color: color-mix(in srgb, var(--color-text) 65%, transparent);
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-diagnostics {
      border-top: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
    }

    body.logo-test .logo-test-diagnostic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-md);
    }

    body.logo-test .logo-test-diagnostic {
      min-height: 92px;
      padding: var(--space-md);
      border: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
      border-radius: 14px;
    }

    body.logo-test .logo-test-diagnostic span {
      display: block;
      color: color-mix(in srgb, var(--color-text) 60%, transparent);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    body.logo-test .logo-test-diagnostic output {
      display: block;
      margin-top: var(--space-sm);
      color: var(--color-text);
      font-size: var(--text-md);
      font-weight: var(--font-weight-bold);
    }

    body.logo-test .logo-test-status {
      min-height: 1.5em;
      margin-top: var(--space-lg);
      color: color-mix(in srgb, var(--color-text) 70%, transparent);
      font-size: var(--text-sm);
    }

    body.logo-test .logo-test-footer {
      margin-top: auto;
    }

    body.logo-test .logo-test-footer .footer__inner {
      max-width: var(--max-width);
      padding: var(--space-md) var(--space-lg);
    }

    body.logo-test .logo-test-footer__logo {
      width: 44px;
      height: 33px;
      flex: 0 0 44px;
      background-color: var(--color-icon);
      -webkit-mask-image: url("assets/staging/logo-sm.svg");
      mask-image: url("assets/staging/logo-sm.svg");
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }

    body.logo-test .logo-test-footer__label {
      color: color-mix(in srgb, var(--color-text) 60%, transparent);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    body.logo-test .logo-test-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 1024px) {
      body.logo-test[data-policy="gap"] {
        --logo-test-slot-width: 152px;
      }

      body.logo-test[data-policy="scale"] {
        --logo-test-slot-width: 152px;
        --logo-test-large-scale: 0.82;
      }
    }

    @media (min-width: 1200px) {
      body.logo-test[data-policy="large"] {
        --logo-test-slot-width: 152px;
      }

      body.logo-test[data-policy="scale"] {
        --logo-test-slot-width: 152px;
        --logo-test-large-scale: 1;
      }
    }

    @media (max-width: 900px) {
      body.logo-test .logo-test-hero,
      body.logo-test .logo-test-controls {
        grid-template-columns: 1fr;
      }

      body.logo-test .logo-test-hero {
        gap: var(--space-2xl);
      }

      body.logo-test .logo-test-section-heading {
        display: block;
      }

      body.logo-test .logo-test-section-heading p {
        margin-top: var(--space-sm);
        text-align: left;
      }
    }

    @media (max-width: 767px) {
      body.logo-test .logo-test-navbar .navbar__inner {
        padding: var(--space-sm) var(--space-md);
      }

      body.logo-test .logo-test-section {
        padding: var(--space-xl) var(--space-md);
      }

      body.logo-test .logo-test-hero {
        padding-top: var(--space-2xl);
        padding-bottom: var(--space-xl);
      }

      body.logo-test .logo-test-hero h1 {
        font-size: clamp(2.6rem, 15vw, 4.5rem);
      }

      body.logo-test .logo-test-control-grid,
      body.logo-test .logo-test-diagnostic-grid {
        grid-template-columns: 1fr;
      }

      body.logo-test .logo-test-footer .footer__inner {
        padding: var(--space-md) var(--space-md);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body.logo-test *,
      body.logo-test *::before,
      body.logo-test *::after {
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    body.logo-test[data-motion="reduced"] *,
    body.logo-test[data-motion="reduced"] *::before,
    body.logo-test[data-motion="reduced"] *::after {
      scroll-behavior: auto !important;
      transition-duration: 1ms !important;
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
    }
  </style>
</head>

                <path d="M10 7C10 10.866 13.134 14 17 14C18.9584 14 20.729 13.1957 21.9995 11.8995C22 11.933 22 11.9665 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C12.0335 2 12.067 2 12.1005 2.00049C10.8043 3.27098 10 5.04157 10 7ZM4 12C4 16.4183 7.58172 20 12 20C15.0583 20 17.7158 18.2839 19.062 15.7621C18.3945 15.9187 17.7035 16 17 16C12.0294 16 8 11.9706 8 7C8 6.29648 8.08133 5.60547 8.2379 4.938C5.71611 6.28423 4 8.9417 4 12Z" />
              </svg>

      </div>
    </header>
  </div>

  <script>
    // Essential Logo Test functionality
    (function () {
      "use strict";
      const root = document.getElementById("logo-test");
      const logo = root.querySelector("[data-logo-trigger]");
      const body = document.body;

      // Simple navigation functionality
      function setContext(context) {
        const buttons = root.querySelectorAll("[data-logo-test-context]");
        buttons.forEach(button => {
          const isActive = button.dataset.logoTestContext === context;
          button.setAttribute("aria-pressed", isActive.toString());
        });
        body.dataset.context = context;
      }

      // Initialize navigation
      setContext("home");

      // Theme toggle functionality
      const themeToggle = root.querySelector("[data-logo-test-theme]");
      function cycleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        const nextTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", nextTheme);
        localStorage.setItem("theme", nextTheme);
      }
      if (themeToggle) {
        themeToggle.addEventListener("click", cycleTheme);
      }

      // Logo hover/tap functionality
      if (logo) {
        logo.addEventListener("click", function () {
          const isExpanded = logo.dataset.logoState === "expanded";
          logo.dataset.logoState = isExpanded ? "small" : "expanded";
        });
      }

      // Mobile menu functionality
      const menuToggle = root.querySelector("[data-logo-test-menu-toggle]");
      const menuClose = root.querySelector("[data-logo-test-menu-close]");
      const mobileMenu = root.querySelector("#logo-test-mobile-menu");

      function openMenu() {
        mobileMenu.hidden = false;
        requestAnimationFrame(() => {
          mobileMenu.classList.add("mobile-menu--open");
        });
      }

      function closeMenu() {
        mobileMenu.classList.remove("mobile-menu--open");
        mobileMenu.addEventListener("transitionend", function handler(event) {
          if (event.target === mobileMenu && !mobileMenu.classList.contains("mobile-menu--open")) {
            mobileMenu.hidden = true;
          }
          mobileMenu.removeEventListener("transitionend", handler);
        }, { once: true });
      }

      if (menuToggle) menuToggle.addEventListener("click", openMenu);
      if (menuClose) menuClose.addEventListener("click", closeMenu);
      if (mobileMenu) {
        mobileMenu.addEventListener("click", function (event) {
          if (event.target === mobileMenu) closeMenu();
        });
      }

      // Keyboard navigation
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && mobileMenu && mobileMenu.classList.contains("mobile-menu--open")) {
          closeMenu();
        }
      });
    })();
  </script>
</body>
